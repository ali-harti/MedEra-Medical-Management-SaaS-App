
services:
  db:
    image: postgres:15-alpine
    container_name: medera_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medera}
      POSTGRES_USER: ${POSTGRES_USER:-medera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medera}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medera"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medera_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medera_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_production_data &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medera}:${POSTGRES_PASSWORD:-medera}@db:5432/${POSTGRES_DB:-medera}
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai_service:5000
      INTERNAL_API_SECRET: medera-internal-secret-token-dev
      WHATSAPP_AGENT_URL: http://whatsapp_agent:8001
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media_files:/app/media
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medera_celery
    command: celery -A config worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medera}:${POSTGRES_PASSWORD:-medera}@db:5432/${POSTGRES_DB:-medera}
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_SECRET: medera-internal-secret-token-dev
      WHATSAPP_AGENT_URL: http://whatsapp_agent:8001
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: medera_ai
    env_file:
      - .env
    environment:
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      MODEL_PATH: models/clinical_rf_v1.pkl
      FLASK_ENV: production
    ports:
      - "5000:5000"
    volumes:
      - ./ai_service:/app
      - ./ai_service/models:/app/models
      - ./ai_service/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./Medera-Frontend
      dockerfile: Dockerfile
    container_name: medera_frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./Medera-Frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  mailhog:
    image: mailhog/mailhog:latest
    container_name: medera_mailhog
    ports:
      - "8025:8025"


  pgadmin:
    image: dpage/pgadmin4
    container_name: medera_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@medera.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  whatsapp_agent:
    build:
      context: ./whatsapp_agent
      dockerfile: Dockerfile
    container_name: medera_whatsapp
    ports:
      - "8001:8001"
    env_file:
      - ./whatsapp_agent/.env
    environment:
      - PORT=8001
      - REDIS_URL=redis://redis:6379/0
      - MEDERA_BACKEND_URL=http://host.docker.internal:8000
      - AI_SERVICE_URL=http://ai_service:5000
    volumes:
      - ./whatsapp_agent:/app
    restart: unless-stopped
    depends_on:
      - redis
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: medera_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
      - whatsapp_agent

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
